name: Precisión del móvil

# Mide la precisión de «Sincronizar palabras con IA» con los modelos ya publicados para Kalena
# (sin volver a exportarlos): la canción sintética con tiempos conocidos, con y sin tiempos de
# línea y con coros sin escribir. «antes» usa el alineador del commit anterior, para comparar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # «antes» = el alineador anterior a «palabras que no empiezan en silencio»; las dos versiones
      # en la misma máquina (la separación de voces varía un poco de un procesador a otro).
      - name: Alineador anterior
        run: git worktree add antes 243d1bb56fd7fe38a2f1fc9c303557ff7f475e60
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Paquetes del sistema
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends espeak-ng ffmpeg
      - name: Dependencias
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r kalena_letras/requirements.txt
      - name: Modelos publicados (int8)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download modelos-movil-v1-int8 -D salida
      - name: Canción sintética con tiempos conocidos
        run: python kalena_letras/tests/make_synthetic_song.py "$PWD/prueba"
      - name: Medir
        run: |
          for v in antes ahora; do
            code=$([ "$v" = antes ] && echo antes || echo .)
            for c in "r1 cancion.wav letra_sincronizada.json con-tiempos-de-línea" \
                     "r2 cancion.wav letra_sin_tiempos.json sin-tiempos-de-línea" \
                     "r3 cancion_coros.wav letra_sincronizada.json coros-sin-escribir"; do
              set -- $c
              python "$code/movil/referencia.py" salida int8 "prueba/$2" "prueba/$3" "prueba/$v-$1.json"
              python kalena_letras/tests/check_selftest.py "prueba/$v-$1.json" prueba/verdad.json "$v: $4" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
      - name: Tiempos palabra a palabra
        if: always()
        run: |
          python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          truth = json.load(open("prueba/verdad.json"))
          for name in ("r1", "r2", "r3"):
              runs = {}
              for v in ("antes", "ahora"):
                  try:
                      runs[v] = json.load(open(f"prueba/{v}-{name}.json"))["words"]
                  except FileNotFoundError:
                      pass
              print(f"\n{name}: palabra, verdad, antes, ahora (ms de diferencia)\n")
              for k, t in enumerate(truth):
                  cols = []
                  for v in ("antes", "ahora"):
                      w = runs.get(v, [None] * len(truth))[k]
                      cols.append("—" if not w or w["start_ms"] is None else f"{w['start_ms'] - t['start_ms']:+d}")
                  print(f"- {t['text']} ({t['start_ms']}): {cols[0]} → {cols[1]}")
          EOF
