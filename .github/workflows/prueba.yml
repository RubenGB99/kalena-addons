name: Prueba

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      separacion:
        description: Separación de voces para la prueba con modelos reales
        type: choice
        options: [maxima, rapida]
        default: maxima

permissions:
  contents: read

jobs:
  logica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install "numpy<2" unidecode==1.3.8 pytest pyflakes
      - run: python -m pyflakes kalena_letras/app kalena_letras/tests
      - run: python -m pytest -q kalena_letras/tests

  complemento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar la configuración del complemento
        uses: frenck/action-addon-linter@v2
        with:
          path: "./kalena_letras"

  modelos-reales:
    needs: logica
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEPARACION: ${{ inputs.separacion || 'maxima' }}
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen (igual que en Home Assistant)
        run: docker build -t kalena-letras ./kalena_letras
      - name: Canción sintética con tiempos conocidos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install "numpy<2"
          python3 kalena_letras/tests/make_synthetic_song.py "$PWD/prueba"
      - name: Modelos en caché
        uses: actions/cache@v4
        with:
          path: modelos
          key: modelos-${{ env.SEPARACION }}-v1
      - name: Letra con tiempos por línea
        run: |
          mkdir -p modelos
          docker run --rm -e KALENA_DATA=/data -v "$PWD/modelos:/data/modelos" -v "$PWD/prueba:/work" kalena-letras \
            python3 -m kalena_letras.selftest /work/cancion.wav /work/letra_sincronizada.json /work/res_sinc.json "$SEPARACION"
          python3 kalena_letras/tests/check_selftest.py prueba/res_sinc.json prueba/verdad.json "con tiempos por línea" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Letra sin tiempos
        if: always()
        run: |
          docker run --rm -e KALENA_DATA=/data -v "$PWD/modelos:/data/modelos" -v "$PWD/prueba:/work" kalena-letras \
            python3 -m kalena_letras.selftest /work/cancion.wav /work/letra_sin_tiempos.json /work/res_plano.json "$SEPARACION"
          python3 kalena_letras/tests/check_selftest.py prueba/res_plano.json prueba/verdad.json "sin tiempos" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: resultados
          path: prueba/*.json
          retention-days: 7
